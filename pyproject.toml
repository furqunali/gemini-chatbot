[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furqunali-gemini-chatbot"
version = "0.1.0"
description = "Provider-independent async Gemini chatbot service"
requires-python = ">=3.10"
dependencies = [
  "google-generativeai>=0.8.0,<1.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
]

[tool.setuptools]
py-modules = [
  "chatbot_config",
  "chatbot_errors",
  "chatbot_protocol",
  "chatbot_service",
  "chatbot_validation",
]
