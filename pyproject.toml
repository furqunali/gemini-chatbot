[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furqunali-gemini-chatbot"
version = "0.2.0"
description = "Provider-independent async Gemini chatbot service"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.0.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
]

[tool.setuptools]
py-modules = [
  "chatbot_config",
  "chatbot_errors",
  "chatbot_protocol",
  "chatbot_service",
  "chatbot_validation",
  "conversation_history",
  "gemini_provider",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
